name: Build XvsO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev             libtinfo6 cmake libffi-dev libssl-dev
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36
      - name: Build debug APK
        env:
          PATH: /home/runner/.local/bin:${{ env.PATH }}
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XvsO-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
